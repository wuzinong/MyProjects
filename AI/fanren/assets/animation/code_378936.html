<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body style="background: transparent;">
<!-- STITCH_SVG_START:ANIMATION_550 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_550" style="display:block;"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter id="blur">
<feGaussianBlur in="SourceGraphic" stdDeviation="5"></feGaussianBlur>
</filter>
</defs>
<g filter="url(#blur)">
<circle cx="100" cy="100" fill="#4B0082" opacity="0.6" r="40">
<animate attributeName="r" dur="3s" repeatCount="indefinite" values="30;60;30"></animate>
<animate attributeName="cx" dur="4s" repeatCount="indefinite" values="95;105;95"></animate>
</circle>
<circle cx="80" cy="80" fill="#000" opacity="0.5" r="25">
<animate attributeName="cy" dur="2.5s" repeatCount="indefinite" values="70;90;70"></animate>
</circle>
<circle cx="120" cy="120" fill="#8A2BE2" opacity="0.4" r="30">
<animate attributeName="cx" dur="3.5s" repeatCount="indefinite" values="130;110;130"></animate>
</circle>
</g>
</svg></div><!-- STITCH_SVG_END:ANIMATION_550 -->




</body></html>
